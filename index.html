<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Finds planned DESC and Georgia ITS transmission projects within 25 miles of each other across the Savannah River, from public filings.">
  <title>GridLock | Savannah River coordination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true"></span><strong>GridLock</strong><span class="brand-scope">Savannah River coordination</span></div>
    <nav class="tabs" aria-label="Views">
      <button type="button" class="tab active" data-view="explore" aria-current="page">Pairs</button>
      <button type="button" class="tab" data-view="quality">Data quality <span id="issue-count" class="tab-count"></span></button>
      <button type="button" class="tab" data-view="method">Method</button>
    </nav>
    <div class="top-actions">
      <button id="shortlist-export" class="button" type="button" disabled>Shortlist briefs <span id="shortlist-count" class="count">0</span></button>
      <button id="export" class="button" type="button">Export CSV</button>
    </div>
  </header>

  <main class="shell">
    <section class="workspace view" id="view-explore" aria-label="Coordination explorer">
      <aside class="side-panel" aria-label="Pairs">
        <div class="side-head">
          <label class="search-wrap"><span class="sr-only">Search projects</span><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="search" type="search" placeholder="Search project, station or ID" autocomplete="off"></label>
          <div class="toolbar">
            <label class="sort-wrap">Sort<select id="sort"></select></label>
            <button id="filter-toggle" class="button" type="button" aria-expanded="false" aria-controls="filters">Filters <span id="filter-count" class="count" hidden></span></button>
          </div>
          <div class="filters" id="filters" hidden>
            <label class="range">In service by <strong id="year-value">2035</strong><input id="year" type="range" min="2025" max="2035" value="2035" title="Both projects must have a target year on or before this year."></label>
            <label class="range">Max distance <strong id="distance-value">25 mi</strong><input id="distance" type="range" min="1" max="25" value="25"></label>
            <label class="select">Timing<select id="gap"><option value="all">Any timing</option><option value="ahead">Build overlap from today on</option><option value="overlap">Build overlap, any time</option><option value="365">In service within 1 year</option><option value="730">In service within 2 years</option></select></label>
            <label class="check"><input id="hide-past" type="checkbox" checked> Hide pairs where both target dates have passed</label>
            <label class="check"><input id="possible" type="checkbox"> Include pairs that could qualify within location uncertainty</label>
            <label class="check"><input id="shortlist-only" type="checkbox"> Shortlisted pairs only</label>
            <div class="filter-foot"><span class="hint" id="sort-hint"></span><button id="reset-filters" class="link-button" type="button">Reset filters</button></div>
          </div>
          <div id="chips" class="chips" aria-label="Active filters"></div>
        </div>
        <div class="list-topline"><span id="result-count">Loading…</span><button id="clear-selection" class="link-button" type="button" disabled>Clear selection</button></div>
        <h2 id="queue-title" class="sr-only">Ranked pairs</h2>
        <div id="match-list" class="match-list" aria-live="polite"></div>
      </aside>

      <section class="map-panel" aria-label="Interactive project map">
        <div id="map" role="region" aria-label="Map of planned projects and qualifying cross-utility pairs"></div>
        <div class="map-controls" role="group" aria-label="Map view"><button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button><button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button><button id="fit" type="button" aria-label="Fit the border region" title="Fit the border region"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button><button id="fit-all" type="button" aria-label="Show both states" title="Show both states"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg></button></div>
        <div class="map-legend">
          <span><i class="dot desc"></i>DESC, South Carolina<b id="desc-count">0</b></span>
          <span><i class="dot gpc"></i>Georgia ITS<b id="gpc-count">0</b></span>
          <span><i class="swatch link"></i>Qualifying pair, straight link</span>
          <span><i class="swatch route"></i>Traced line, selected project</span>
        </div>
      </section>

      <aside class="detail-panel" id="detail" aria-live="polite" aria-label="Details"></aside>
    </section>

    <section class="doc-view view" id="view-quality" hidden aria-label="Data quality"></section>
    <section class="doc-view view" id="view-method" hidden aria-label="Method and sources"></section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
